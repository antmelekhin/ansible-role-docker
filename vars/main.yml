---
# Docker conflicting packages
__docker_conflicting_packages_dict:
  Debian:
    - 'containerd'
    - 'docker.io'
    - 'docker-compose'
    - 'docker-doc'
    - 'podman-docker'
    - 'runc'
  RedHat:
    - 'docker'
    - 'docker-client'
    - 'docker-client-latest'
    - 'docker-common'
    - 'docker-engine'
    - 'docker-engine-selinux.noarch'
    - 'docker-latest'
    - 'docker-latest-logrotate'
    - 'docker-logrotate'
    - 'docker-selinux.noarch'
    - 'podman'
    - 'runc'

__docker_conflicting_packages: '{{ __docker_conflicting_packages_dict[ansible_os_family] }}'

# Default Docker GPG key
__docker_repository_gpgkey_url_dict:
  Debian: '{{ docker_repository_mirror_url }}/{{ ansible_distribution | lower }}/gpg'
  RedHat: "{{ docker_repository_mirror_url }}/{{ (ansible_distribution == 'Fedora') | ternary('fedora', 'centos') }}/gpg"

__docker_repository_gpgkey_url: '{{ __docker_repository_gpgkey_url_dict[ansible_os_family] }}'
__docker_repository_gpgkey_keyring: '/usr/share/keyrings/docker-archive-keyring.gpg'

# Default Docker repository
__docker_repository_dict:
  Debian: 'deb [signed-by={{ __docker_repository_gpgkey_keyring }}] {{ docker_repository_mirror_url }}/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} {{ docker_repository_release_channel }}'
  RedHat: "{{ docker_repository_mirror_url }}/{{ (ansible_distribution == 'Fedora') | ternary('fedora', 'centos') }}/$releasever/$basearch/{{ docker_repository_release_channel }}"

__docker_repository: '{{ __docker_repository_dict[ansible_os_family] }}'

# Docker packages
__docker_packages_dict:
  Debian:
    - 'containerd.io'
    - "docker-ce{{ ('=' + docker_package_version) if (docker_package_version | length) else '' }}"
    - "docker-ce-cli{{ ('=' + docker_package_version) if (docker_package_version | length) else '' }}"
    - 'docker-buildx-plugin'
    - 'docker-compose-plugin'
  RedHat:
    - 'containerd.io'
    - "docker-ce{{ ('-' + docker_package_version) if (docker_package_version | length) else '' }}"
    - "docker-ce-cli{{ ('-' + docker_package_version) if (docker_package_version | length) else '' }}"
    - 'docker-buildx-plugin'
    - 'docker-compose-plugin'

__docker_packages: '{{ __docker_packages_dict[ansible_os_family] }}'
