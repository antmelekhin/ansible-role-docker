---
- name: 'Uninstall Docker Engine'
  become: true
  block:
    - name: 'Debian | Uninstall the Docker Engine packages'
      ansible.builtin.apt:
        name: '{{ __docker_packages }}'
        autoremove: true
        purge: true
        state: 'absent'
      when: ansible_facts['os_family'] == 'Debian'

    - name: 'RedHat | Uninstall the Docker Engine packages'
      ansible.builtin.yum:
        name: '{{ __docker_packages }}'
        autoremove: true
        state: 'absent'
      when: ansible_facts['os_family'] == 'RedHat'

    - name: 'Remove the Docker Engine repository'
      ansible.builtin.file:
        path: '{{ __docker_repository_file }}'
        state: 'absent'

    - name: 'Remove a Docker Engine configuration directory'
      ansible.builtin.file:
        dest: '/etc/docker'
        state: 'absent'

    - name: 'Remove a Docker Engine group'
      ansible.builtin.group:
        name: 'docker'
        state: 'absent'
